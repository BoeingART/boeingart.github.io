    科研项目:
      - company: 数据驱动的协同催化反应发现与主动学习优化平台
        position: 共同第一作者 / 项目负责人（NSFC 博士研究生项目）
        start_date: 2024-03
        end_date: 至今
        summary: Nature Synth. (2026)
        highlights:
          - 针对小样本、高噪声的有机合成实验场景，设计并开发基于贝叶斯优化的主动学习算法，解决高维复杂化学空间的搜索难题。
          - 实现自动化 DFT 计算描述符提取工作流，适配贝叶斯优化算法，打通从“反应设计-分子特征提取-主动学习优化”的一站式全链路优化平台。
          - 仅通过 63 次合成实验，完成超 180 万规模反应空间的全局优化，显著提升反应发现效率。

      - company: 高精度 Ullmann 反应预测模型与 SynAD 算法可靠性框架
        position: 第一作者 / 项目负责人（NSFC 本科生项目）
        start_date: 2023-09
        end_date: 2025-10
        summary: Angew. Chem. Int. Ed. (2026)
        highlights:
          - 深度融合物理有机化学知识，系统开发自动化 DFT 计算描述符计算流程，主导构建高精度 Ullmann 反应产率预测模型。
          - 针对 AI 模型在化学合成中的“外推陷阱”，创新性提出 Synthetic Applicability Domain (SynAD) 框架，建立模型在未知化学空间中的不确定性评估机制。
          - 在 Ullmann 反应数据集等 7 个自建与公开数据集上对框架进行严格评估，证明 SynAD 能有效过滤不可靠预测结果，提高模型可靠性。

      - company: 基于计算机视觉的高分子共聚物相容性预测
        position: 第二作者
        start_date: 2022-05
        end_date: 2023-07
        summary: J. Chem. Inf. Model. (2023)
        highlights:
          - 构建深度卷积神经网络（CNN）视觉模型，实现对聚合物 SEM 微观图像的大规模特征自动提取。
          - 完成材料相容性等核心物理性质的快速自动表征，替代传统低效的人工分析流程。

